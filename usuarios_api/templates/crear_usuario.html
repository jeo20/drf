<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear usuario</title>
</head>

<body>

    <h1>Crear usuario</h1>

    <form method="post">

        {% csrf_token %}

        <div>
            <label for="nombre">
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >
        </div>

        <br>

        <div>
            <label for="username">
                Usuario
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <br>

        <div>
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <br>

        <button type="submit">
            Crear usuario
        </button>

    </form>

    {% if error %}

        <h2>Error</h2>

        <p>
            {{ error }}
        </p>

    {% endif %}

    {% if usuario %}

        <h2>Usuario creado</h2>

        <p>
            ID:
            {{ usuario.id }}
        </p>

        <p>
            Nombre:
            {{ usuario.name }}
        </p>

        <p>
            Usuario:
            {{ usuario.username }}
        </p>

        <p>
            Email:
            {{ usuario.email }}
        </p>

    {% endif %}

</body>
</html>
