<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
</head>
<body>

    <h1>Usuarios obtenidos desde una API</h1>

    <ul>
        {% for usuario in usuarios %}
            <li>
                <strong>{{ usuario.name }}</strong>
                - {{ usuario.email }}
            </li>
        {% endfor %}
    </ul>

</body>
</html>
